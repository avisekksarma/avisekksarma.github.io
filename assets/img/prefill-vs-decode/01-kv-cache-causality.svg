lphabetic">Layer 1 output at j depends only on</text><text x="175.1798858642578" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1971c2" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">tokens 0..j</text></g><g stroke-linecap="round" transform="translate(10 250) rotate(0 210 35)"><path d="M0 0 L420 0 L420 70 L0 70" stroke="none" stroke-width="0" fill="#a5d8ff"/><path d="M0 0 C136.09 0, 272.19 0, 420 0 M0 0 C102.19 0, 204.38 0, 420 0 M420 0 C420 23.07, 420 46.13, 420 70 M420 0 C420 16.95, 420 33.89, 420 70 M420 70 C285.2 70, 150.4 70, 0 70 M420 70 C277.95 70, 135.9 70, 0 70 M0 70 C0 49.4, 0 28.8, 0 0 M0 70 C0 50.12, 0 30.25, 0 0" stroke="#1971c2" stroke-width="2" fill="none"/></g><g transform="translate(17.610137939453125 260) rotate(0 202.38986206054688 25)"><text x="202.38986206054688" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1971c2" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">So layer 2 input at j is unchanged by new</text><text x="202.38986206054688" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1971c2" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">tokens</text></g><g stroke-linecap="round" transform="translate(10 370) rotate(0 210 35)"><path d="M0 0 L420 0 L420 70 L0 70" stroke="none" stroke-width="0" fill="#a5d8ff"/><path d="M0 0 C84.01 0, 168.03 0, 420 0 M0 0 C91.48 0, 182.97 0, 420 0 M420 0 C420 24.49, 420 48.98, 420 70 M420 0 C420 19.16, 420 38.33, 420 70 M420 70 C286.46 70, 152.93 70, 0 70 M420 70 C323.87 70, 227.75 70, 0 70 M0 70 C0 54.53, 0 39.07, 0 0 M0 70 C0 44.44, 0 18.89, 0 0" stroke="#1971c2" stroke-width="2" fill="none"/></g><g transform="translate(77.2200927734375 392.5) rotate(0 142.7799072265625 12.5)"><text x="142.7799072265625" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#1971c2" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Same argument at every layer</text></g><g stroke-linecap="round" transform="translate(10 490) rotate(0 210 35)"><path d="M0 0 L420 0 L420 70 L0 70" stroke="none" stroke-width="0" fill="#99e9f2"/><path d="M0 0 C89.91 0, 179.83 0, 420 0 M0 0 C156.12 0, 312.24 0, 420 0 M420 0 C420 25.98, 420 51.95, 420 70 M420 0 C420 28, 420 56, 420 70 M420 70 C273.84 70, 127.69 70, 0 70 M420 70 C298.73 70, 177.47 70, 0 70 M0 70 C0 45.95, 0 21.9, 0 0 M0 70 C0 52.94, 0 35.88, 0 0" stroke="#0c8599" stroke-width="2" fill="none"/></g><g transform="translate(19.150115966796875 512.5) rotate(0 200.84988403320312 12.5)"><text x="200.84988403320312" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#0c8599" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">K and V at j never change once computed</text></g><g stroke-linecap="round" transform="translate(10 610) rotate(0 210 40)"><path d="M0 0 L420 0 L420 80 L0 80" stroke="none" stroke-width="0" fill="#b2f2bb"/><path d="M0 0 C143.66 0, 287.32 0, 420 0 M0 0 C94.24 0, 188.47 0, 420 0 M420 0 C420 19.41, 420 38.82, 420 80 M420 0 C420 28.64, 420 57.29, 420 80 M420 80 C322.59 80, 225.17 80, 0 80 M420 80 C293.4 80, 166.81 80, 0 80 M0 80 C0 62.58, 0 45.17, 0 0 M0 80 C0 48.87, 0 17.73, 0 0" stroke="#2f9e44" stroke-width="2" fill="none"/></g><g transform="translate(35.0001220703125 625) rotate(0 184.9998779296875 25)"><text x="184.9998779296875" y="17.619999999999997" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Cache K and V. Queries are used once,</text><text x="184.9998779296875" y="42.62" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="20px" fill="#2f9e44" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">not needed again</text></g><g stroke-linecap="round"><g transform="translate(220 88.5) rotate(0 0 16.5)"><path d="M0 0 C-0.7 8.93, 0.59 18.74, 0 33 M0 0 C0.19 11.72, 0.4 22.64, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 88.5) rotate(0 0 16.5)"><path d="M-5.29 17.37 C-4.26 21.32, -1.63 25.99, 0 33 M-5.29 17.37 C-3.31 23.01, -1.3 28, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 88.5) rotate(0 0 16.5)"><path d="M5.99 17.63 C3.69 21.48, 2.98 26.08, 0 33 M5.99 17.63 C4.05 23.17, 2.14 28.07, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g></g><mask/><g stroke-linecap="round"><g transform="translate(220 208.5) rotate(0 0 16.5)"><path d="M0 0 C-0.88 8.04, -0.81 15.12, 0 33 M0 0 C0.25 11.2, -0.29 21.82, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 208.5) rotate(0 0 16.5)"><path d="M-5.77 17.54 C-5.19 21.58, -3.86 24.81, 0 33 M-5.77 17.54 C-3.67 22.9, -2.22 27.81, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 208.5) rotate(0 0 16.5)"><path d="M5.52 17.45 C3.59 21.48, 2.42 24.73, 0 33 M5.52 17.45 C3.91 22.86, 1.65 27.79, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g></g><mask/><g stroke-linecap="round"><g transform="translate(220 328.5) rotate(0 0 16.5)"><path d="M0 0 C0.62 8.02, 0.38 17.84, 0 33 M0 0 C0.4 9.54, 0.19 19.86, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 328.5) rotate(0 0 16.5)"><path d="M-5.42 17.42 C-3.43 20.96, -2.19 25.97, 0 33 M-5.42 17.42 C-3.49 21.81, -2.05 26.85, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g><g transform="translate(220 328.5) rotate(0 0 16.5)"><path d="M5.87 17.58 C4.85 21.03, 3.09 26, 0 33 M5.87 17.58 C4.44 21.95, 2.51 26.94, 0 33" stroke="#1e1e1e" stroke-width="2" fill="none"/></g></g><mask/><g stroke-linecap="round"><g transform="tran
<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a waveguide carries light from a display to the eye</title>
<desc>A small display feeds light into a thin glass slab. The light bounces in a zigzag inside the glass via total internal reflection, then an out-coupler kicks it downward toward an eye.</desc>
<defs>
<marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#4b5563;}
</style>

<rect x="50" y="55" width="100" height="50" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
<text class="th" x="100" y="85" text-anchor="middle">Tiny display</text>

<line x1="150" y1="80" x2="168" y2="150" stroke="#d97706" stroke-width="1.5" opacity="0.85" marker-end="url(#arrowAmber)"/>

<rect x="140" y="140" width="380" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
<text class="ts" x="330" y="128" text-anchor="middle">Waveguide (thin glass)</text>

<polyline points="170,150 230,185 290,150 350,185 410,150 470,185" fill="none" stroke="#d97706" stroke-width="2" opacity="0.9"/>

<rect x="455" y="170" width="35" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>

<line x1="490" y1="182" x2="543" y2="158" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="545" y="152" text-anchor="start">Out-coupler</text>
<text class="ts" x="545" y="169" text-anchor="start">to your eye</text>

<text class="ts" x="330" y="218" text-anchor="middle">Light bounces inside via total internal reflection</text>

<line x1="472" y1="182" x2="573" y2="292" stroke="#d97706" stroke-width="1.5" opacity="0.85" marker-end="url(#arrowAmber)"/>

<ellipse cx="580" cy="310" rx="26" ry="16" fill="none" stroke="#1f2937" stroke-width="1"/>
<circle cx="580" cy="310" r="7" fill="#1f2937" opacity="0.8"/>
<text class="ts" x="580" y="345" text-anchor="middle">Your eye</text>
</svg>

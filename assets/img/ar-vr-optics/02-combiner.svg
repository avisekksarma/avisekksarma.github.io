<svg width="100%" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How an AR combiner merges real-world light with display light</title>
<desc>Real-world light passes straight through a slanted half-mirror glass, while display light reflects off the same glass, and both merge into one beam heading into the eye.</desc>
<defs>
<marker id="arrowAmber2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#4b5563;}
</style>

<text class="th" x="85" y="125" text-anchor="middle">Real world</text>
<circle cx="75" cy="150" r="10" fill="none" stroke="#1f2937" stroke-width="1"/>
<polygon points="60,190 85,155 110,190" fill="none" stroke="#1f2937" stroke-width="1"/>

<line x1="120" y1="170" x2="368" y2="170" stroke="#0d9488" stroke-width="2" opacity="0.9"/>
<text class="ts" x="140" y="152" text-anchor="start">Real-world light</text>

<rect x="325" y="50" width="90" height="45" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
<text class="th" x="370" y="76" text-anchor="middle">Display</text>

<line x1="370" y1="97" x2="370" y2="168" stroke="#d97706" stroke-width="2" opacity="0.9" marker-end="url(#arrowAmber2)"/>
<text class="ts" x="390" y="130" text-anchor="start">Display light</text>

<rect x="315" y="167" width="110" height="6" rx="2" transform="rotate(45 370 170)" fill="#dbeafe" stroke="#2563eb" stroke-width="1" opacity="0.9"/>

<line x1="400" y1="188" x2="440" y2="120" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<text class="th" x="440" y="112" text-anchor="start">Combiner</text>
<text class="ts" x="440" y="129" text-anchor="start">(half-mirror glass)</text>

<line x1="372" y1="170" x2="550" y2="170" stroke="#7c3aed" stroke-width="2.5" opacity="0.95" marker-end="url(#arrowPurple)"/>
<text class="ts" x="470" y="195" text-anchor="middle">Merged into one image</text>

<ellipse cx="580" cy="170" rx="26" ry="16" fill="none" stroke="#1f2937" stroke-width="1"/>
<circle cx="580" cy="170" r="7" fill="#1f2937" opacity="0.8"/>
<text class="ts" x="580" y="205" text-anchor="middle">Your eye</text>
</svg>

<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Bragg selectivity: a recorded film only reacts to matching light</title>
<desc>Three rays hit the same recorded film. Only the ray matching the original recording angle and color gets diffracted; the other two, with wrong angle or wrong color, pass straight through unaffected.</desc>
<defs>
<marker id="arrowAmber4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowTeal4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowBlue4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#4b5563;}
</style>

<rect x="330" y="50" width="14" height="220" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<rect x="330" y="90" width="14" height="20" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>

<line x1="100" y1="90" x2="328" y2="105" stroke="#d97706" stroke-width="2" opacity="0.9" marker-end="url(#arrowAmber4)"/>
<line x1="346" y1="105" x2="460" y2="80" stroke="#d97706" stroke-width="2" opacity="0.9" marker-end="url(#arrowAmber4)"/>
<text class="th" x="470" y="75" text-anchor="start">Correct match</text>
<text class="ts" x="470" y="92" text-anchor="start">&#8594; diffracted</text>

<line x1="100" y1="170" x2="460" y2="170" stroke="#0d9488" stroke-width="2" opacity="0.85" marker-end="url(#arrowTeal4)"/>
<text class="th" x="470" y="165" text-anchor="start">Wrong angle</text>
<text class="ts" x="470" y="182" text-anchor="start">passes through</text>

<line x1="100" y1="240" x2="460" y2="240" stroke="#2563eb" stroke-width="2" opacity="0.85" marker-end="url(#arrowBlue4)"/>
<text class="th" x="470" y="235" text-anchor="start">Wrong color</text>
<text class="ts" x="470" y="252" text-anchor="start">passes through</text>
</svg>

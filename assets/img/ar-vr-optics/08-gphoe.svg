<svg width="100%" viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>GPHOE: does two different jobs depending on spin</title>
<desc>Left-handed circularly polarized light gets converged like a real lens. Right-handed circularly polarized light passes straight through as if the film were plain flat glass, acting as a window.</desc>
<defs>
<marker id="arrowAmber8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowTeal8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#4b5563;}
</style>

<rect x="330" y="70" width="14" height="160" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>

<text class="th" x="100" y="90" text-anchor="start">LCP light</text>
<text class="ts" x="100" y="105" text-anchor="start">(left-hand spin)</text>
<line x1="100" y1="112" x2="328" y2="112" stroke="#d97706" stroke-width="2" opacity="0.9" marker-end="url(#arrowAmber8)"/>
<line x1="346" y1="105" x2="460" y2="112" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<line x1="346" y1="112" x2="460" y2="112" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<line x1="346" y1="119" x2="460" y2="112" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<circle cx="460" cy="112" r="3" fill="#d97706"/>
<text class="th" x="475" y="95" text-anchor="start">Lens mode</text>
<text class="ts" x="475" y="112" text-anchor="start">(converges light)</text>

<text class="th" x="100" y="175" text-anchor="start">RCP light</text>
<text class="ts" x="100" y="190" text-anchor="start">(right-hand spin)</text>
<line x1="100" y1="200" x2="460" y2="200" stroke="#0d9488" stroke-width="2" opacity="0.85" marker-end="url(#arrowTeal8)"/>
<text class="th" x="475" y="195" text-anchor="start">Window mode</text>
<text class="ts" x="475" y="212" text-anchor="start">(plain pass-through)</text>
</svg>

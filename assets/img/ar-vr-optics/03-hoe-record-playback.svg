<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How a holographic optical element is recorded and played back</title>
<desc>Left panel: a reference beam and a signal beam overlap on photosensitive film, recording an interference pattern. Right panel: a plain probe beam hits the recorded film and reproduces the signal beam's shape, converging light just like a real lens.</desc>
<defs>
<marker id="arrowAmber3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#d97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowTeal3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#1f2937;}
.th{font-size:14px;font-weight:600;}
.ts{font-size:12px;fill:#4b5563;}
</style>

<text class="th" x="180" y="28" text-anchor="middle">Recording</text>
<rect x="170" y="60" width="14" height="220" rx="2" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
<line x1="172" y1="96" x2="182" y2="104" stroke="#1f2937" stroke-width="1" opacity="0.6"/>
<line x1="172" y1="136" x2="182" y2="144" stroke="#1f2937" stroke-width="1" opacity="0.6"/>
<line x1="172" y1="176" x2="182" y2="184" stroke="#1f2937" stroke-width="1" opacity="0.6"/>
<line x1="172" y1="216" x2="182" y2="224" stroke="#1f2937" stroke-width="1" opacity="0.6"/>

<line x1="50" y1="170" x2="167" y2="170" stroke="#0d9488" stroke-width="2" opacity="0.85" marker-end="url(#arrowTeal3)"/>
<text class="ts" x="50" y="155" text-anchor="start">Reference beam</text>

<text class="th" x="130" y="45" text-anchor="middle">Signal beam</text>
<text class="ts" x="130" y="60" text-anchor="middle">(shape being recorded)</text>
<line x1="130" y1="75" x2="166" y2="95" stroke="#d97706" stroke-width="1.5" opacity="0.85" marker-end="url(#arrowAmber3)"/>
<line x1="130" y1="75" x2="166" y2="140" stroke="#d97706" stroke-width="1.5" opacity="0.85" marker-end="url(#arrowAmber3)"/>
<line x1="130" y1="75" x2="166" y2="185" stroke="#d97706" stroke-width="1.5" opacity="0.85" marker-end="url(#arrowAmber3)"/>

<line x1="345" y1="55" x2="345" y2="285" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>

<text class="th" x="500" y="28" text-anchor="middle">Playback</text>
<rect x="493" y="60" width="14" height="220" rx="2" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>

<line x1="380" y1="170" x2="491" y2="170" stroke="#0d9488" stroke-width="2" opacity="0.85" marker-end="url(#arrowTeal3)"/>
<text class="ts" x="380" y="155" text-anchor="start">Probe beam</text>
<text class="ts" x="380" y="185" text-anchor="start">(plain light)</text>

<line x1="507" y1="95" x2="600" y2="170" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<line x1="507" y1="140" x2="600" y2="170" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<line x1="507" y1="185" x2="600" y2="170" stroke="#d97706" stroke-width="1.5" opacity="0.85"/>
<circle cx="600" cy="170" r="3" fill="#d97706"/>
<text class="ts" x="555" y="205" text-anchor="middle">Acts like a real lens</text>
</svg>

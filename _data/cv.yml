          - Worked with the SRE team to improve reliability and scalability of distributed systems using GCP, Kubernetes, Docker, and Redis.
          - Built and maintained scalable backend services and APIs using Flask and MongoDB for high-volume document processing workflows.

    Publications:
      - title: Topic Modeling for Nepali Political News Using Probabilistic, Algebraic and Transformer-Based Methods
        authors:
          - Abhishek Sharma
          - Aashish Adhikari
          - Manoj Khatri
          - Hrishav Khadka
          - Aman Shakya
        publisher: IEEE International Conference on Inventive Computation Technologies (ICICT)
        releaseDate: 2025-04
        url: https://ieeexplore.ieee.org/document/11004776
        summary: Comparative evaluation of LDA, NMF, LSA, and BERTopic on Nepali political news. Findings favor classical probabilistic methods for this low-resource language setting.

    Projects:
      - name: Topic Modeling for Nepali Political News
        summary: Comparative study of probabilistic, algebraic, and transformer-based topic modeling (LDA, BERTopic, and related methods) for Nepali, a low-resource language. Scraped and cleaned news data from online portals. Paper accepted at ICICT 2025 (IEEE Xplore).
        highlights:
          - LDA, BERTopic, nltk, Pandas, spaCy, gensim
        url: https://ieeexplore.ieee.org/document/11004776
        start_date: 2024
        end_date: 2025

      - name: Videolize — Text Script to Video Generator
        summary: Deep learning system converting sequential scripts to video using Stable Diffusion, Microsoft text-to-audio, and the Gemini API. Scene images are interpolated with spherical interpolation for smooth transitions. First prize, GenAI category, LOCUS Hack-A-Week 2023.
        highlights:
          - PyTorch, HuggingFace, Stable Diffusion, Gemini API
        start_date: 2023
        end_date: 2023

      - name: Information Extraction from Invoices using LLMs
        summary: Invoice table and key-value extraction combining GPT-4 Vision with locally fine-tuned table transformers and YOLO for object detection. First prize, LLM category, Kathmandu University AI Competition 2023.
        highlights:
          - LLMs, YOLO, GPT-4 API, Table Transformers
        start_date: 2023
        end_date: 2023

      - name: University Network Infrastructure Design
        summary: Campus network topology design across multiple departments, including subnetting, VLANs, web and DNS servers, and OSPF dynamic routing (Cisco Packet Tracer).
        highlights:
          - Cisco Packet Tracer, OSPF, VLANs
        start_date: 2023
        end_date: 2023

      - name: Checkers with AI
        summary: Object-oriented Checkers implementation in C++ with an adversarial AI using Minimax and alpha–beta pruning (SFML, CMake).
        highlights:
          - C++, Minimax, Alpha–beta pruning, SFML
        start_date: 2022
        end_date: 2022

      - name: Procedural Terrain Generator
        summary: Procedural hill terrain generation using Perlin noise, with controllable randomness, clipping, and wireframe rendering (C++, CMake).
        highlights:
          - C++, Perlin noise, CMake
        start_date: 2022
        end_date: 2022

